[project]
name = "duckdock"
version = "0.1.5"
description = "Custom Tiling Window Manager and Touch Dashboard for 7-inch 800x600 subscreen"
authors = [{ name = "Nexus" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "pywin32>=306",
    "psutil>=5.9.0",
    "pycaw>=20240210",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.4.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "win32: Tests requiring Windows Win32 API",
    "gui: GUI and PySide6 widgets tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
